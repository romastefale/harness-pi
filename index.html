<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harness Pi — DeepSeek Harness</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #050810;
            color: #e8eaed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .bg-gradient {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 20% 40%, rgba(30, 80, 180, 0.35), transparent),
                radial-gradient(ellipse 70% 50% at 80% 60%, rgba(80, 40, 160, 0.3), transparent),
                radial-gradient(ellipse 60% 40% at 50% 20%, rgba(0, 120, 200, 0.2), transparent);
            animation: fluidMove 20s ease-in-out infinite alternate;
            z-index: 0;
        }
        @keyframes fluidMove {
            0% { transform: scale(1) translate(0, 0); opacity: 0.9; }
            50% { transform: scale(1.1) translate(-2%, 1%); opacity: 1; }
            100% { transform: scale(1.05) translate(1%, -1%); opacity: 0.95; }
        }
        .bg-grid {
            position: fixed;
            inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
            mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 30%, transparent 80%);
        }
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 2rem;
            max-width: 600px;
            width: 100%;
        }
        .logo {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #4a9eff 0%, #a78bfa 50%, #4a9eff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            font-size: 1.1rem;
            color: #9aa0a6;
            margin-bottom: 2.5rem;
            font-weight: 400;
        }
        .card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 2rem;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .btn {
            display: inline-block;
            padding: 0.9rem 2.5rem;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.35);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(37, 99, 235, 0.5);
        }
        .btn:active { transform: translateY(0); }
        .status {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #6b7280;
        }
        .status.redirecting { color: #4a9eff; }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(74, 158, 255, 0.3);
            border-top-color: #4a9eff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .footer {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: #4b5563;
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="bg-grid"></div>

    <div class="container">
        <h1 class="logo">Harness Pi</h1>
        <p class="subtitle">DeepSeek Harness · Ambiente pessoal</p>

        <div class="card">
            <a href="#" id="launch-btn" class="btn">Acessar Harness</a>
            <p class="status" id="status">Redirecionando para o servidor...</p>
        </div>

        <p class="footer">Uso pessoal · Não afiliado à DeepSeek</p>
    </div>

    <script>
        // ✅ URL REAL DO SEU RAILWAY
        const RAILWAY_URL = 'https://harness-pi.up.railway.app';

        const btn = document.getElementById('launch-btn');
        const status = document.getElementById('status');

        btn.href = RAILWAY_URL;

        let countdown = 3;
        const timer = setInterval(() => {
            countdown--;
            if (countdown > 0) {
                status.innerHTML = `<span class="spinner"></span>Redirecionando em ${countdown}s...`;
            } else {
                clearInterval(timer);
                status.textContent = 'Redirecionando...';
                status.classList.add('redirecting');
                window.location.href = RAILWAY_URL;
            }
        }, 1000);

        status.innerHTML = `<span class="spinner"></span>Redirecionando em ${countdown}s...`;

        btn.addEventListener('click', () => {
            clearInterval(timer);
        });
    </script>
</body>
</html>
