<script>
    (()=>{
      'use strict';
      const OA='/api/openai/v1';

      const USER_KEY='pithomate.githubUser';
      const MCP='https://api.githubcopilot.com/mcp/';
      const MODEL='gpt-6-astra';
      const BETA={'OpenAI-Beta':'agents=v1'};
      const state={auth:0,authenticating:false,historyError:'',repoError:'',githubUser:localStorage.getItem(USER_KEY)||'',githubEditing:false,key:false,repos:[],repo:null,branch:null,sessions:[],current:null,running:false,controller:null,github:null,pr:null};
      const $=(q,r=document)=>r.querySelector(q),$$=(q,r=document)=>[...r.querySelectorAll(q)];
      const icon=n=>`<span class="material-symbols-rounded" aria-hidden="true">${n}</span>`;
      const els={stage:$('#stage'),prompt:$('#prompt'),send:$('#sendBtn'),toast:$('#toast')};
      const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const time=v=>v?new Date(v*1000).toLocaleString():new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
      const err=e=>String(e?.error?.message||e?.message||e?.error||e||'Erro desconhecido');
      const connectionError=e=>{const m=err(e);if(/timed?\s*out|timeout|network|failed to fetch|fetch failed|load failed|offline/i.test(m))return'Não foi possível conectar ao GitHub. Verifique sua conexão e tente novamente.';if(/HTTP 404/i.test(m))return'Usuário GitHub não encontrado.';if(/HTTP 403|HTTP 429|Limite do GitHub/i.test(m))return'Limite de consultas do GitHub atingido. Tente novamente mais tarde.';return'Não foi possível carregar os repositórios. Tente novamente.'};
      function note(t){els.toast.textContent=t;els.toast.classList.add('show');clearTimeout(note.t);note.t=setTimeout(()=>els.toast.classList.remove('show'),1900)}
      function closeComposerMenus(){$('#composerRepoMenu').hidden=true;$('#composerBranchMenu').hidden=true;$('#composerRepo').setAttribute('aria-expanded','false');$('#composerBranch').setAttribute('aria-expanded','false')}
      function closePopovers(){$('#leftMenu').classList.remove('open');$('#leftBtn').setAttribute('aria-expanded','false');closeComposerMenus()}
      function openSheet(id,{keepMenu=false}={}){if(!keepMenu)closePopovers();const s=$('#'+id),el=document.activeElement,r=el?.getBoundingClientRect?.(),h=window.visualViewport?.height||window.innerHeight,top=Math.max(16,Math.min(r?.top??h*.2,h*.32));s.returnFocus=el;s.dataset.returnToMenu=String(keepMenu);s.style.setProperty('--sheet-top',top+'px');s.classList.add('open');s.setAttribute('aria-hidden','false');$('.app').inert=true;(s.querySelector('input:not(:disabled),button:not(:disabled)')||s).focus()}
      function closeSheet(id){const s=$('#'+id);if(!s.classList.contains('open'))return;s.classList.remove('open');s.setAttribute('aria-hidden','true');$('.app').inert=false;if(s.returnFocus?.isConnected)s.returnFocus.focus();if(s.dataset.returnToMenu==='true')$('#leftMenu').classList.add('open')}
      function tab(name){$$('.tab').forEach(x=>{const active=x.dataset.tab===name;x.classList.toggle('is-active',active);x.setAttribute('aria-selected',String(active));x.tabIndex=active?0:-1});$$('.panel').forEach(x=>x.classList.toggle('active',x.dataset.panel===name));$('#backBtn').disabled=name==='projects';closePopovers();els.stage.scrollTop=0}
      function oaHeaders(json=false){return {...BETA,...(json?{'Content-Type':'application/json'}:{})}}
      async function oa(path,opt={}){const auth=state.auth;const res=await fetch(OA+path,{...opt,signal:opt.signal||AbortSignal.timeout(30000),headers:{...oaHeaders(opt.body!==undefined),...(opt.headers||{})}});if(auth!==state.auth)throw new DOMException('Sessão alterada','AbortError');if(!res.ok){let d=null;try{d=await res.json()}catch{}const e=new Error(d?.error?.message||d?.message||`OpenAI HTTP ${res.status}`);e.status=res.status;throw e}return res}
      async function json(path,opt={}){return (await oa(path,opt)).json()}
      async function gh(path){const res=await fetch(GH+path,{signal:AbortSignal.timeout(20000),headers:{Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}});if(!res.ok)throw new Error(res.status===403||res.status===429?'Limite do GitHub atingido. Tente novamente mais tarde.':`GitHub HTTP ${res.status}`);return res.json()}
      function safe(s){return typeof s==='string'&&s.length>0&&!/[\x00-\x1f\x7f]/.test(s)}
      function sh(s){return `'${String(s).replace(/'/g,"'\"'\"'")}'`}
      function resizePrompt(){els.prompt.style.height='auto';els.prompt.style.height=Math.max(44,Math.min(160,els.prompt.scrollHeight))+'px'}
      function updateSend(){els.send.disabled=state.running||state.authenticating||!state.key||!state.repo||!state.branch||!els.prompt.value.trim();els.send.title=state.running?'Execução em andamento':!state.key?'Conectando ao Pithomate':!state.repo?'Escolha um projeto':!state.branch?'Escolha uma branch':'Enviar solicitação';$('#apiRefresh').disabled=state.running||state.authenticating;els.prompt.disabled=state.running}
      function apiStatus(ok,title,sub){$('#apiStatusIcon').textContent=ok?'cloud_done':state.authenticating?'cloud_sync':'cloud_off';$('#apiStatusTitle').textContent='OpenAI';$('#apiStatusTitle').className='status-title';$('#apiStatusSub').textContent=ok?'Conectado':state.authenticating?'Conectando':'Indisponível';$('#apiStatusSub').className='status-sub '+(ok?'ok':state.authenticating?'':'bad');$('#apiMenuState').textContent=ok?'Ativo':state.authenticating?'Conectando':'Indisponível'}
      function githubStatus(ok,title,sub){$('#githubStatusIcon').textContent=ok?'verified':'account_tree';renderGithubConnection()}
      function renderGithubConnection(){const u=state.githubUser,edit=state.githubEditing,b=$('#githubSwitch'),sub=$('#githubStatusSub');$('#githubStatusTitle').textContent=u?'@'+u:'GitHub';$('#githubStatusTitle').className='status-title';sub.textContent=state.repoError?'Indisponível':state.github?'Conectado':u?'Somente leitura':'Não conectado';sub.className='status-sub '+(state.repoError?'bad':state.github?'ok':'');$('#githubConnectForm').hidden=!!u&&!edit;b.hidden=!u||edit;b.textContent=state.repoError?'Atualizar':'Trocar';if(!edit)$('#githubUserInput').value=u;$('#githubConnectError').hidden=true}

      async function loadRepos(){const input=$('#githubUserInput');const raw=(input?.value??state.githubUser).trim();if(!/^[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?$/.test(raw)){state.repoError=raw?'Informe um usuário GitHub válido.':'Informe um usuário GitHub para carregar repositórios.';state.repos=[];state.repo=null;state.branch=null;renderRepos();renderProjects();renderGithubConnection();return}state.repoError='';renderRepos(true);try{const data=[];for(let page=1;;page++){const rows=await gh(`/users/${encodeURIComponent(raw)}/repos?per_page=100&sort=updated&type=owner&page=${page}`);data.push(...rows);if(rows.length<100)break}state.githubUser=raw;localStorage.setItem(USER_KEY,raw);const previous=state.repo;state.repos=data.map(r=>({name:r.name,path:r.full_name,desc:r.description||'',private:!!r.private,archived:!!r.archived,default_branch:r.default_branch||'main',html_url:r.html_url}));if(previous){const updated=state.repos.find(r=>r.path===previous.path);if(updated){updated.branches=previous.branches||[];updated.branchError=previous.branchError||'';updated.loadingBranches=!!previous.loadingBranches;state.repo=updated}else{state.repo=null;state.branch=null}}renderRepos();renderProjects();renderGithubConnection()}catch(e){state.repoError=connectionError(e);renderRepos();renderGithubConnection()}}
      async function loadBranches(repo){repo.loadingBranches=true;repo.branchError='';if(state.repo===repo){state.branch=null;renderProjects();renderRepos();updateSend()}try{const rows=[];for(let page=1;;page++){const data=await gh(`/repos/${repo.path.split('/').map(encodeURIComponent).join('/')}/branches?per_page=100&page=${page}`);rows.push(...data);if(data.length<100)break}repo.branches=rows.map(x=>x.name);if(state.repo!==repo)return;state.branch=repo.branches.includes(repo.default_branch)?repo.default_branch:null}catch(e){if(state.repo!==repo)return;repo.branches=[];repo.branchError=err(e)}finally{repo.loadingBranches=false;if(state.repo===repo){renderProjects();renderRepos();updateSend()}}}
      async function selectRepo(i){const repo=state.repos[i];if(!repo||repo.archived)return;state.repo=repo;state.branch=null;repo.branches=[];repo.branchError='';renderProjects();renderRepos();await loadBranches(repo)}
      function selectBranch(b){if(!state.repo?.branches?.includes(b))return;state.branch=b;renderProjects();renderRepos();updateSend()}
      function requestIcon(){return '<svg class="request-symbol" viewBox="0 -960 960 960" aria-hidden="true"><path d="M160-240v-480 520-40Zm0 80q-33 0-56.5-23.5T80-240v-480q0-33 23.5-56.5T160-800h240l80 80h320q33 0 56.5 23.5T880-640v200h-80v-200H447l-80-80H160v480h200v80H160ZM584-56 440-200l144-144 56 57-87 87 87 87-56 57Zm192 0-56-57 87-87-87-87 56-57 144 144L776-56Z"/></svg>'}
      function pageState(iconName,title,subtitle,{empty=true,action=''}={}){return `<div class="${empty?'empty page-empty':'page-heading'}"><div class="empty-inner"><div class="empty-icon glass">${iconName==='requests'?requestIcon():icon(iconName)}</div><h2>${esc(title)}</h2><p>${esc(subtitle)}</p>${action}</div></div>`}
      function renderComposerSelectors(){const repoButton=$('#composerRepo'),branchButton=$('#composerBranch'),repoMenu=$('#composerRepoMenu'),branchMenu=$('#composerBranchMenu');if(!repoButton||!branchButton)return;repoButton.disabled=!state.repos.length||state.running;$('#composerRepoLabel').textContent='Repositórios';repoMenu.innerHTML=state.repos.map((r,i)=>`<button class="composer-option" type="button" role="option" data-composer-repo="${i}" aria-selected="${state.repo===r}">${icon('account_tree')}<span class="composer-option-main"><strong>${esc(r.name)}</strong><small>${esc(r.path)}</small></span></button>`).join('')||'<div class="composer-option" aria-disabled="true"><span class="composer-option-main"><strong>Sem repositórios</strong><small>Conecte uma conta em Conexões.</small></span></div>';const branches=state.repo?.branches||[];$('#composerBranchLabel').textContent=state.branch||'Branch';branchButton.disabled=!state.repo||!branches.length||!!state.repo.loadingBranches||!!state.repo.branchError||state.running;branchMenu.innerHTML=branches.map(b=>`<button class="composer-option" type="button" role="option" data-composer-branch="${esc(b)}" aria-selected="${state.branch===b}"><svg class="branch-symbol" viewBox="0 -960 960 960" aria-hidden="true"><path d="M160-440v-80h304l200-200H560v-80h240v240h-80v-104L496-440H160Zm400 280v-80h104L536-366l58-58 126 128v-104h80v240H560Z"/></svg><span class="composer-option-main"><strong>${esc(b)}</strong></span></button>`).join('')||`<div class="composer-option" aria-disabled="true"><svg class="branch-symbol" viewBox="0 -960 960 960" aria-hidden="true"><path d="M160-440v-80h304l200-200H560v-80h240v240h-80v-104L496-440H160Zm400 280v-80h104L536-366l58-58 126 128v-104h80v240H560Z"/></svg><span class="composer-option-main"><strong>${state.repo?.loadingBranches?'Carregando branches':state.repo?'Sem branches':'Selecione um repositório'}</strong></span></div>`;$$('[data-composer-repo]',repoMenu).forEach(x=>x.onclick=()=>{closeComposerMenus();selectRepo(+x.dataset.composerRepo)});$$('[data-composer-branch]',branchMenu).forEach(x=>x.onclick=()=>{closeComposerMenus();selectBranch(x.dataset.composerBranch)});const error=$('#composerBranchError');error.hidden=!state.repo?.branchError;if(!error.hidden)error.querySelector('span').textContent='Falha ao carregar branches.'}
      function renderRepos(loading=false){const p=$('#reposPanel'),rows=state.repos.map((r,i)=>`<button class="row ${state.repo===r?'selected':''}" type="button" data-repo-row="${i}" aria-pressed="${state.repo===r}" ${r.archived?'disabled':''}><span class="row-icon">${icon('account_tree')}</span><span class="row-main"><span class="row-title">${esc(r.name)}</span><span class="row-sub">${esc(r.path)}${r.desc?' · '+esc(r.desc):''}</span></span><span class="pill ${state.repo===r?'ok':''}">${state.repo===r?'Em uso':'Usar'}</span></button>`).join('');const head=pageState('account_tree','Repositórios',state.githubUser?`@${state.githubUser}`:'Conecte uma conta GitHub em Conexões.',{empty:!rows});const status=loading?pageState('progress_activity','Carregando repositórios','Buscando no GitHub.',{empty:true}):state.repoError?pageState('cloud_off','GitHub indisponível','Não foi possível carregar os repositórios.',{empty:!rows,action:'<button class="action" type="button" data-retry-repos>Tentar novamente</button>'}):!rows?pageState('account_tree','Nenhum repositório','Conecte GitHub em Conexões para escolher um repositório.',{empty:true}):'';p.innerHTML=`${rows?head:''}${status}<div class="repo-list">${rows}</div>`;$$('[data-repo-row]',p).forEach(x=>x.onclick=()=>selectRepo(+x.dataset.repoRow));const retry=$('[data-retry-repos]',p);if(retry)retry.onclick=loadRepos;renderComposerSelectors()}

      $$('.tab').forEach(x=>x.onclick=()=>tab(x.dataset.tab));
      $('#composer').onsubmit=e=>{e.preventDefault();submit()};
      $('#composerRepo').onclick=e=>{e.stopPropagation();if(e.currentTarget.disabled)return;const m=$('#composerRepoMenu'),open=m.hidden;closeComposerMenus();if(open){m.hidden=false;e.currentTarget.setAttribute('aria-expanded','true')}};
      $('#composerBranch').onclick=e=>{e.stopPropagation();if(e.currentTarget.disabled)return;const m=$('#composerBranchMenu'),open=m.hidden;closeComposerMenus();if(open){m.hidden=false;e.currentTarget.setAttribute('aria-expanded','true')}};
      $('#composerRetryBranches').onclick=()=>{if(state.repo)loadBranches(state.repo)};
      $('#leftBtn').onclick=e=>{e.stopPropagation();const m=$('#leftMenu'),was=m.classList.contains('open');closePopovers();if(!was){m.classList.add('open');$('#leftBtn').setAttribute('aria-expanded','true')}};
      $('#menuClose').onclick=()=>{closePopovers();$('#leftBtn').focus()};
      $('#leftMenu').onclick=e=>{e.stopPropagation();const a=e.target.closest('[data-action]');if(!a)return;if(a.dataset.action==='connections')openSheet('apiSheet',{keepMenu:true});if(a.dataset.action==='usage'){closePopovers();renderUsage();openSheet('usageSheet')}};
      document.addEventListener('click',e=>{if(e.target.closest('[data-retry-repos]'))loadRepos()});$('#apiRefresh').onclick=authenticate;$('#githubConnectForm').onsubmit=async e=>{e.preventDefault();const b=$('#githubConnectBtn');b.disabled=true;b.textContent='Conectando…';await loadRepos();b.disabled=false;b.textContent='Conectar';if(!state.repoError)state.githubEditing=false;renderGithubConnection()};$('#githubSwitch').onclick=async()=>{if(state.repoError&&state.githubUser){const b=$('#githubSwitch');b.disabled=true;b.textContent='…';await loadRepos();renderGithubConnection();b.disabled=false;return}state.githubEditing=true;$('#githubUserInput').value=state.githubUser;renderGithubConnection();$('#githubUserInput').focus()};
      $('#openUsage').onclick=()=>window.open('https://platform.openai.com/usage','_blank','noopener,noreferrer');
      $('#openPr').onclick=()=>{const r=state.pr;if(!r?.remoteReady)return;const base=encodeURIComponent(r.branch),head=encodeURIComponent(r.remoteBranch);window.open(`https://github.com/${r.repo?.path||r.repoPath}/compare/${base}...${head}?expand=1`,'_blank','noopener,noreferrer');closeSheet('prSheet')};
      $$('[data-close]').forEach(x=>x.onclick=()=>closeSheet(x.dataset.close));
      $$('.sheet').forEach(s=>s.onclick=e=>{if(e.target===s)closeSheet(s.id)});
      document.addEventListener('click',e=>{if(!e.target.closest('.anchor,.sheet,.composer-pick'))closePopovers()});
      document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePopovers();$$('.sheet.open').forEach(s=>closeSheet(s.id))}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();els.prompt.focus()}});
      els.prompt.addEventListener('input',()=>{resizePrompt();updateSend()});
      els.prompt.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(!els.send.disabled)submit()}});
      init();renderProjects();renderHistory();renderUsage();renderRepos();renderGithubConnection();if(state.githubUser)loadRepos();updateSend();authenticate();
    })();
